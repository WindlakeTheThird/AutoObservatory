# Autoobservatory regression net.
#
# Everything in `make check` used to run only when someone remembered to run it.
# `make check` is the project's whole safety net -- the ephemeris self-checks in
# both languages, the frozen-value HGPhase test, the sky-view projection test,
# the horizontal-coordinate test, catalog sanity, the CSV malformed-input net,
# the VSOP87 table cross-check, and the CLI exit-code conventions. Run on every
# push and PR.
#
# The GUI tests need a display, so Xvfb provides a virtual one. Note that
# tools/namecheck_gui.sh SKIPS ITSELF when DISPLAY is unset and still exits 0 --
# so without a display this job would report green having tested nothing. The
# display is started here and its presence is asserted before the suite runs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: make check (C++ + Pascal)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make python3 \
            fpc \
            lazarus \
            libgtk2.0-dev \
            xvfb \
            x11-utils

      - name: Report toolchain versions
        run: |
          g++ --version | head -1
          make --version | head -1
          fpc -iV
          echo "LAZDIR candidates: $(ls -d /usr/lib/lazarus/* 2>/dev/null | tr '\n' ' ')"
          test -d "$(ls -d /usr/lib/lazarus/[0-9]* 2>/dev/null | head -1)" \
            && echo "lazarus LCL root found" \
            || { echo "::error::no Lazarus LCL under /usr/lib/lazarus - `make gui` will fail"; exit 1; }

      # Xvfb needs time to create the socket before anything can connect to it.
      # Polling here matters: a fixed sleep raced and the display check below
      # failed intermittently.
      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          for i in $(seq 1 30); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "virtual display ready after ${i}s"
              echo "DISPLAY=:99" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Xvfb did not come up on :99"
          exit 1

      # Guard: if DISPLAY is somehow absent, namecheck_gui.sh silently skips and
      # the suite goes green without having exercised the GUI.
      - name: Confirm the GUI tests will actually run
        run: |
          echo "DISPLAY=$DISPLAY"
          if [ -z "$DISPLAY" ]; then
            echo "::error::no DISPLAY - GUI checks would silently skip"
            exit 1
          fi
          xdpyinfo -display "$DISPLAY" >/dev/null && echo "virtual display OK"

      - name: make check
        run: make check

  firmware:
    name: Arduino firmware (strict compile)
    runs-on: ubuntu-latest

    # Compiles the sketch with -Wall -Wextra -Werror. Not part of `make check`
    # because it needs the Arduino toolchain; kept as its own job so a toolchain
    # hiccup cannot mask the host-side regression net.
    #
    # No third-party action: `arduino/setup-arduino` does not exist (GitHub
    # reports 404), and arduino/actions is a Taskfile repo, not a setup action.
    # Instead install arduino-cli from a PINNED release tarball with a verified
    # sha256. v1.5.1 is deliberately the same version the project vendors at
    # ./bin/arduino-cli, so CI and local build with identical tooling.
    env:
      ARDUINO_CLI_VERSION: 1.5.1
      ARDUINO_CLI_SHA256: 28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b

    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli (pinned, checksum-verified)
        run: |
          set -euo pipefail
          url="https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          curl -fsSL -o /tmp/arduino-cli.tgz "$url"
          echo "${ARDUINO_CLI_SHA256}  /tmp/arduino-cli.tgz" | sha256sum --check --strict
          tar -xzf /tmp/arduino-cli.tgz -C /usr/local/bin arduino-cli
          chmod +x /usr/local/bin/arduino-cli
          arduino-cli version

      # arduino:renesas_uno (UNO R4) ships in Arduino's OWN package index -- no
      # third-party index is needed. (An earlier version of this workflow passed
      # --additional-urls at a URL that 404s.)
      - name: Install the UNO R4 core
        run: |
          set -euo pipefail
          arduino-cli core update-index
          arduino-cli core install arduino:renesas_uno
          # Fail loudly if the FQBN we compile against is not actually registered.
          arduino-cli board listall | grep -q "arduino:renesas_uno:minima" \
            || { echo "::error::arduino:renesas_uno:minima not in board list"; exit 1; }

      # The sketch's headers live in the ARDUINO SKETCHBOOK (~/Arduino/libraries
      # on a dev box), which a CI runner does not have -- so the compile fails
      # with "Adafruit_LSM303_Accel.h: No such file or directory". Install them
      # from Library Manager instead.
      #
      # Versions are pinned to the ones this project is developed against, so CI
      # and local build against the same drivers. Library Manager resolves the
      # transitive dependencies itself (Adafruit Unified Sensor, Adafruit BusIO).
      - name: Install sketch libraries
        run: |
          set -euo pipefail
          arduino-cli lib install "Adafruit LSM303 Accel@1.1.9"
          arduino-cli lib install "Adafruit LSM303DLH Mag@1.0.11"
          echo "--- installed ---"
          arduino-cli lib list

      - name: Compile mount_tracker strictly
        run: |
          set -euo pipefail
          arduino-cli compile --fqbn arduino:renesas_uno:minima \
            --build-property "compiler.cpp.extra_flags=-Wall -Wextra -Werror -Wno-switch" \
            arduino/mount_tracker